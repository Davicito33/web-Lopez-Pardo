<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        Registro
                    </h2>

                    <form (ngSubmit)="registrar()">

                        <div class="mb-3">

                            <label>Usuario</label>

                            <input
                                type="text"
                                class="form-control"
                                [(ngModel)]="usuario"
                                name="usuario"
                            >

                        </div>

                        <div class="mb-3">

                            <label>Correo</label>

                            <input
                                type="email"
                                class="form-control"
                                [(ngModel)]="correo"
                                name="correo"
                            >

                        </div>

                        <div class="mb-3">

                            <label>Contraseña</label>

                            <input
                                type="password"
                                class="form-control"
                                [(ngModel)]="clave"
                                name="clave"
                            >

                        </div>

                        <button
                            class="btn btn-success w-100"
                            type="submit"
                        >
                            Registrarse
                        </button>

                    </form>

                    <div class="text-center mt-3">

                        <span>
                            ¿Ya tienes cuenta?
                        </span>

                        <a
                            routerLink="/"
                            class="ms-2"
                            style="cursor:pointer;"
                        >
                            Iniciar sesión
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
